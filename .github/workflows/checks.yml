# Every push: the Python reference checks, then the JS core against the
# Python fixtures, then a build of the demo pages. A check that fails exits
# non-zero and turns the run red.
name: checks

on:
  push:
  pull_request:

jobs:
  python:
    name: Python reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vanilla blur pricer (check.py)
        run: python reference/check.py
      - name: Single barriers vs closed forms and QuantLib
        run: python reference/check_barriers.py
      - name: Double knock-out image series
        run: python reference/check_double_barrier.py
      - name: Greeks near the barrier, monitoring-error slopes
        run: python reference/check_greeks_monitoring.py
      - name: Fat-tailed kernels vs Merton series, QuantLib, Carr-Madan
        run: python reference/check_kernels.py
      - name: Implied-vol smile, flattening, negative-jump skew
        run: python reference/check_smile.py
      - name: Merton calibration recovers a synthetic chain
        run: python reference/check_calibration.py

  node:
    name: JS core vs Python fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node src/test.mjs
      - run: node src/test-barriers.mjs
      - name: FFT blur vs direct blur, wraparound test
        run: node src/test-fft.mjs
      - name: Fat-tailed kernels and the smile vs Python
        run: node src/test-kernels.mjs
      - run: npm ci
      - name: Build the demo, check and bench pages
        run: npm run build
