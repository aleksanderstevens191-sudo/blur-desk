# Every push: the Python reference checks (two stocks and local vol included), the full SPY chain rerun from its
# saved snapshot, the JS core against the Python fixtures and a build of the
# demo pages, and the WebGPU shaders against the same fixtures in headless
# Chromium on its software GPU (SwiftShader). A check that fails exits
# non-zero and turns the run red.
name: checks

on:
  push:
  pull_request:

jobs:
  python:
    name: Python reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vanilla blur pricer (check.py)
        run: python reference/check.py
      - name: Single barriers vs closed forms and QuantLib
        run: python reference/check_barriers.py
      - name: Double knock-out image series
        run: python reference/check_double_barrier.py
      - name: Greeks near the barrier, monitoring-error slopes
        run: python reference/check_greeks_monitoring.py
      - name: Fat-tailed kernels vs Merton series, QuantLib, Carr-Madan
        run: python reference/check_kernels.py
      - name: Implied-vol smile, flattening, negative-jump skew
        run: python reference/check_smile.py
      - name: Merton calibration recovers a synthetic chain
        run: python reference/check_calibration.py
      - name: Real SPY chain, Merton fit vs flat Black-Scholes
        run: python reference/check_spy_fit.py
      - name: Two stocks, 2D blur vs Margrabe, Stulz, the 1D product and QuantLib
        run: python reference/check_2d.py
      - name: Two stocks, exchange value vs correlation, spread vs Kirk
        run: python reference/intuition_2d.py
      - name: Local vol, surface arbitrage, Dupire, the blur vs Black-Scholes, GPU fixtures, model risk
        run: python reference/check_lv_ci.py

  chain:
    name: Full SPY chain, rerun from the saved snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Filters, parity forwards, early exercise and the Merton fit must reproduce the committed files
        run: python reference/check_chain_fit.py
      - name: Out-of-sample Merton vs flat Black-Scholes
        run: python reference/chain_oos.py --check

  node:
    name: JS core vs Python fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node src/test.mjs
      - run: node src/test-barriers.mjs
      - name: FFT blur vs direct blur, wraparound test
        run: node src/test-fft.mjs
      - name: Fat-tailed kernels and the smile vs Python
        run: node src/test-kernels.mjs
      - name: The whole SPY chain's jobs in 64-bit vs QuantLib and the Merton series
        run: node src/test-chain.mjs
      - name: The market's odds (sum, mean, tail odds vs Merton's closed form)
        run: node src/test-odds.mjs
      - name: Two stocks, the 2D blur in 64-bit JS vs Python, 2D FFT, wraparound test
        run: node src/test-2d.mjs
      - name: Local vol, the variable-width blur in 64-bit JS vs Python, flat vol vs Black-Scholes
        run: node src/test-lv.mjs
      - run: npm ci
      - name: Build the demo, check and bench pages
        run: npm run build

  gpu:
    name: WebGPU shaders vs Python fixtures (software GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install headless Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps --only-shell chromium
      - name: Vanilla, American and barrier fixtures on the GPU
        run: node src/test-gpu.mjs fixtures
      - name: FFT blur vs direct blur on the GPU, wraparound test
        run: node src/test-gpu.mjs fft
      - name: Fat-tailed kernels and the smile on the GPU vs Python
        run: node src/test-gpu.mjs kernels
      - name: The whole SPY chain in one GPU submit vs QuantLib and the Merton series
        run: node src/test-gpu.mjs chain
      - name: The market's odds edge-detected from GPU prices
        run: node src/test-gpu.mjs odds
      - name: Two stocks, the 2D blur on the GPU (direct and FFT) vs Python, wraparound test
        run: node src/test-gpu.mjs 2d
      - name: Two stocks, the demo's panel 14 driven like a user, live errors under 1e-4
        run: node src/test-demo-2d.mjs
      - name: Local vol, the variable-width blur on the GPU vs Python
        run: node src/test-gpu.mjs lv
      - name: Local vol, the demo's panel 15 driven like a user, live round trip under 0.1 vol pts
        run: node src/test-demo-lv.mjs
